# Live HiPIMS monitor case tuned for the desktop 4080 workflow.
base: hipims_cu_ar_pic_public.yaml

name: "hipims_cu_ar_pic_monitor"

grid:
  nr: 60
  nz: 100
  permittivity_factor: 10.0

particles:
  ppc: 16
  n0_electron: 8.0e+14
  n0_ion: 8.0e+14
  te_ev: 3.0
  ti_ev: 0.1

time:
  dt: 5.0e-12
  n_steps: 4000
  diag_interval: 40
  compact_interval: 200
  checkpoint_interval: 0

output:
  dir: "output/pic/hipims_cu_ar_pic_monitor"

case:
  benchmark: "Interactive Cu/Ar HiPIMS monitor"
  material_system: "Cu/Ar"
  inputs:
    - name: "gudmundsson_case1_waveform"
      kind: "waveform"
      path: "data/waveforms/cu_ar_case1_literature_fit.csv"
      provenance: "literature-fit"
      citation: "Literature-fit waveform derived from public Cu/Ar HiPIMS references."
    - name: "biagi_e_ar_archive"
      kind: "cross_sections"
      path: "data/cross_sections/LXCat_Biagi_e_Ar.zip"
      provenance: "public-download"
      citation: "Biagi database, LXCat, retrieved March 16, 2026."
    - name: "surrogate_magnetron_field"
      kind: "magnetic_field"
      path: "data/field_maps/hipims_cu_ar_pic_surrogate.npz"
      provenance: "surrogate"
      citation: "Field map generated from the analytic current-loop magnetron model."
  notes: "Monitor-grade live case with moderate extra cost for richer racetrack, sputter, and substrate diagnostics."

validation: null
